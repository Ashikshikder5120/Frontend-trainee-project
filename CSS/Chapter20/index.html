<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animations & Transitions | Ashik Shikder</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="header">
    <h1>Chapter 20: CSS Motion</h1>
  </header>

  <main class="container">

    <section class="card">
      <h2>20.1 Smooth Transitions</h2>
      <p>Hover over these boxes to see different timing functions.</p>
      <div class="demo-box ease">Ease (Default)</div>
      <div class="demo-box linear">Linear</div>
      <div class="demo-box ease-out">Ease-Out</div>
    </section>

    <section class="card">
      <h2>20.2 Keyframe Animations</h2>
      <p>This box moves and changes color automatically.</p>
      <div class="animation-container">
        <div class="moving-box">Animated</div>
      </div>
    </section>

  </main>

</body>

</html>
