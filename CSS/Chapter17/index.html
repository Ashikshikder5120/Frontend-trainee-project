<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>CSS Backgrounds | Ashik Shikder Lab</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container">
    <header>
      <h1>CSS Backgrounds Styling</h1>
      <p>Lab Project by Ashik Shikder | Azimpur</p>
    </header>

    <section class="card bg-image-section">
      <h3>7.1.5 Background Size (Cover)</h3>
      <div class="box cover-bg">This box is covered by the image.</div>
    </section>

    <section class="card">
      <h3>7.2 Linear & Radial Gradients</h3>
      <div class="box linear-grad">Modern Linear Gradient</div>
      <div class="box radial-grad">Smooth Radial Gradient</div>
    </section>

    <section class="card">
      <h3>7.1.7 Background Clip</h3>
      <div class="box clip-content">Background only in Content Box</div>
    </section>
  </div>

</body>

</html>
