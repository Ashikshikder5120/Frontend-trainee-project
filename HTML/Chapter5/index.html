<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CHAPTER 5: Web Forms - Ashik Shikder</title>
  <style>
    :root {
      --primary: #1e40af;
      --bg: #f1f5f9;
      --invalid: #fee2e2;
      --valid: #dcfce7;
    }

    body {
      font-family: 'Segoe UI', Tahoma, sans-serif;
      background-color: var(--bg);
      margin: 0;
      padding: 20px;
    }

    .form-card {
      max-width: 800px;
      margin: 0 auto;
      background: white;
      padding: 40px;
      border-radius: 15px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
    }

    header {
      text-align: center;
      border-bottom: 2px solid #e2e8f0;
      margin-bottom: 30px;
      padding-bottom: 20px;
    }

    /* .1.5 fieldset and legend */
    fieldset {
      border: 2px solid #e2e8f0;
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 25px;
    }

    legend {
      font-weight: bold;
      color: var(--primary);
      padding: 0 10px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 5px;
      font-weight: 500;
    }

    /* .4.6 Styling for Invalid Inputs */
    input:invalid {
      background-color: var(--invalid);
      border: 1px solid #ef4444;
    }

    input:valid {
      background-color: var(--valid);
    }

    input[type="text"],
    input[type="password"],
    input[type="email"],
    input[type="number"],
    input[type="url"],
    select,
    textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      box-sizing: border-box;
    }

    /* .2.3.2 range slider */
    input[type="range"] {
      width: 100%;
    }

    .btn-container {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    input[type="submit"],
    input[type="reset"],
    button {
      padding: 12px 25px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.3s;
    }

    input[type="submit"] {
      background: var(--primary);
      color: white;
    }

    input[type="reset"] {
      background: #94a3b8;
      color: white;
    }

    footer {
      text-align: center;
      margin-top: 30px;
      color: #64748b;
    }
  </style>
</head>

<body>

  <div class="form-card">
    <header>
      <h1>Web Forms,Azimpur Community Portal</h1>
      <p>Member Registration Form | Developed by <strong>Ashik Shikder</strong></p>
    </header>

    <form action="/submit-data" method="GET">

      <fieldset>
        <legend>Account Information</legend>
        <div class="form-group">
          <label for="acc-name">Username (.1.1):</label>
          <input type="text" id="acc-name" name="username" placeholder="e.g. ashik_dhaka" required autofocus />
        </div>
        <div class="form-group">
          <label for="acc-pass">Password (.2.2.2):</label>
          <input type="password" id="acc-pass" name="password" minlength="6" required />
        </div>
      </fieldset>

      <fieldset>
        <legend>Personal Details (Azimpur, Dhaka)</legend>

        <div class="form-group">
          <label for="email">Email Address (.2.2.3):</label>
          <input type="email" id="email" name="user_email" required />
        </div>

        <div class="form-group">
          <label for="bio">Short Biography (.1.2):</label>
          <textarea id="bio" name="comment" rows="3" placeholder="Tell us about yourself..."></textarea>
        </div>

        <div class="form-group">
          <label for="area">Select Area (.1.3):</label>
          <select name="location" id="area">
            <optgroup label="Dhaka South">
              <option value="azimpur">Azimpur</option>
              <option value="lalbagh">Lalbagh</option>
            </optgroup>
            <optgroup label="Dhaka North">
              <option value="gulshan">Gulshan</option>
              <option value="uttara">Uttara</option>
            </optgroup>
          </select>
        </div>
      </fieldset>

      <fieldset>
        <legend>Preferences & Data (.2.3 - .2.7)</legend>

        <div class="form-group">
          <label>Age Range (.2.3.2):</label>
          <input type="range" name="age" min="18" max="100" step="1">
        </div>

        <div class="form-group">
          <label>Gender (.2.4.2):</label>
          <input type="radio" id="male" name="gender" value="male"> <label style="display:inline"
            for="male">Male</label>
          <input type="radio" id="female" name="gender" value="female"> <label style="display:inline"
            for="female">Female</label>
        </div>

        <div class="form-group">
          <label>Favorite Color (.2.7):</label>
          <input type="color" name="favcolor">
        </div>

        <div class="form-group">
          <label>Date of Birth (.2.6.1):</label>
          <input type="date" name="dob">
        </div>

        <div class="form-group">
          <label>Upload Profile Photo (.2.5):</label>
          <input type="file" name="profile_pic">
        </div>
      </fieldset>

      <div class="form-group">
        <label>Registration ID (Read-only):</label>
        <input type="text" name="regId" value="AZP-2026-X" readonly>
      </div>

      <input type="hidden" name="admin_code" value="12345">
      <div class="btn-container">
        <input type="submit" value="Register Now"> <input type="reset" value="Clear Form"> <button type="button"
          onclick="alert('Welcome from Azimpur, Dhaka!')">Help</button>
      </div>
    </form>
  </div>

  <footer>
    <address>
      Azimpur Road, Dhaka-1205, Bangladesh<br>
      Developed by: <strong>Ashik Shikder</strong>
    </address>
    <p>&copy; 2026 Semantic Form Lab</p>
  </footer>

</body>

</html>
